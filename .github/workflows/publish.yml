name: Publish

# Publishes Marey to npm and the official MCP Registry on a version tag (vX.Y.Z).
# npm publish MUST run before the registry step: the registry validates the live
# npm package and its `mcpName` field during `mcp-publisher publish`.
#
# Required repository secret:
#   NPM_TOKEN — an npm granular token with "bypass 2FA" and publish rights to
#   `@anilyesilkaya/marey`.
# OIDC (id-token: write) proves ownership of the io.github.anilyesilkaya/* namespace;
# no registry secret is needed.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC auth for the MCP registry
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      # --- npm (must come first) ---
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- official MCP Registry ---
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
