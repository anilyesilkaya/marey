<!doctype html>
<!--
  A reproducible layout bug: clicking opens a readable menu, but a post-open
  measurement sets its width to the trigger's width and clips the action labels.
  The same handlers run in the live and frozen demos.
  ?t=<ms> renders a fixed point in the interaction for the README generator.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — clipped menu demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #edf2f7; color: #18293e; font: 18px/1.4 Arial, sans-serif; padding: 18px; }
    .app { height: 364px; border: 1px solid #d6dfe9; border-radius: 14px; background: #fff; overflow: hidden; }
    header { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid #e4eaf1; font-weight: 700; }
    .logo { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #176a56; color: white; font-size: 18px; }
    .workspace { margin-left: auto; color: #66778a; font-size: 14px; font-weight: 400; }
    main { padding: 22px; position: relative; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .eyebrow { color: #66778a; font-size: 13px; margin-bottom: 4px; }
    h1 { font-size: 25px; letter-spacing: -.5px; line-height: 1.2; margin: 0; }
    #trigger { width: 88px; height: 44px; flex-shrink: 0; border: 1px solid #bac9d6; background: #f2f6fa; border-radius: 9px; font-size: 16px; color: #18293e; cursor: pointer; }
    #trigger[aria-expanded="true"] { border-color: #176a56; background: #e6f4ee; }
    .progress { color: #66778a; font-size: 14px; margin-top: 18px; }
    .bar { height: 5px; background: #e8eef3; border-radius: 5px; margin: 8px 0 14px; }
    .bar::before { content: ''; display: block; height: 100%; width: 33.33%; border-radius: inherit; background: #176a56; }
    .task { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #edf1f5; font-size: 18px; }
    .box { width: 19px; height: 19px; border: 1.5px solid #b9c7d4; border-radius: 5px; }
    .done .box { display: grid; place-items: center; border-color: #176a56; background: #176a56; color: white; font-size: 14px; }
    .done { color: #66778a; }
    #menu { position: absolute; right: 22px; top: 86px; width: 250px; padding: 8px; border: 1px solid #b9c7d4; border-radius: 10px; background: white; box-shadow: 0 8px 24px #18293e26; z-index: 2; }
    #menu button { display: block; text-align: left; width: 100%; padding: 12px; border: 0; border-radius: 6px; background: white; color: #18293e; font: 19px/1.3 Arial, sans-serif; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: clip; }
    #menu button:last-child { color: #ae3e35; border-top: 1px solid #e4eaf1; border-radius: 0; }
    #menu button:hover { background: #f2f6fa; }
    #pointer { position: fixed; width: 25px; height: 31px; pointer-events: none; z-index: 3; }
  </style>
</head>
<body>
  <div class="app">
    <header><span class="logo">P</span> Projects <span class="workspace">Design team</span></header>
    <main>
      <div class="heading">
        <div><div class="eyebrow">Project overview</div><h1>Website launch</h1></div>
        <button id="trigger" type="button" aria-label="Project actions" aria-haspopup="menu" aria-expanded="false">More ▾</button>
      </div>
      <div class="progress">1 of 3 tasks complete</div><div class="bar"></div>
      <div class="task done"><span class="box">✓</span> Review wireframes</div>
      <div class="task"><span class="box"></span> Finalize homepage</div>
      <div class="task"><span class="box"></span> Publish website</div>
      <div id="menu" role="menu" hidden>
        <button type="button" role="menuitem">Edit project details</button>
        <button type="button" role="menuitem">Duplicate project</button>
        <button type="button" role="menuitem">Archive project</button>
      </div>
    </main>
  </div>
  <svg id="pointer" viewBox="0 0 25 31" aria-hidden="true">
    <path d="M2 2v23l6-6 5 10 5-2-5-10h9Z" fill="white" stroke="#18293e" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
  <script>
    const trigger = document.getElementById('trigger');
    const menu = document.getElementById('menu');
    const pointer = document.getElementById('pointer');
    let layoutTimer;
    const setOpen = (open) => {
      clearTimeout(layoutTimer);
      menu.hidden = !open;
      menu.style.width = '';
      trigger.setAttribute('aria-expanded', String(open));
    };
    function measureMenu() {
      // BUG: measuring the trigger instead of the menu's content makes the
      // popup too narrow. Its nowrap labels overflow their clipped buttons.
      menu.style.width = `${trigger.offsetWidth}px`;
    }
    trigger.addEventListener('click', () => {
      setOpen(menu.hidden);
      if (!menu.hidden && frozenTime === null) layoutTimer = setTimeout(measureMenu, 120);
    });
    document.addEventListener('click', (event) => {
      if (!menu.contains(event.target) && !trigger.contains(event.target)) setOpen(false);
    });
    const bounds = trigger.getBoundingClientRect();
    pointer.style.left = `${bounds.x + bounds.width / 2}px`;
    pointer.style.top = `${bounds.y + bounds.height / 2}px`;

    function renderAt(timeMs) {
      setOpen(false);
      if (timeMs >= 320) trigger.click();
      if (timeMs >= 440) measureMenu();
    }
    const frozenTime = new URLSearchParams(location.search).get('t');
    if (frozenTime !== null) {
      renderAt(Number(frozenTime));
    } else {
      // Autoplay one pass; the button also reproduces the bug when clicked.
      setTimeout(() => renderAt(320), 320);
    }
  </script>
</body>
</html>
